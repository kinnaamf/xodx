<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030303">
  <meta name="description" content="DXWORLD. Sound. Vision. 2027.">
  <title>DXWORLD — 2027</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect width='60' height='60' fill='%23030303'/%3E%3Ctext x='5' y='39' font-family='Arial' font-weight='900' font-size='29' fill='%23bbbbbb'%3EDX%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=dx-11">
</head>
<body>
  <audio id="site-audio" src="assets/site-track.mp3" preload="auto" autoplay loop></audio>
  <main class="splash" aria-labelledby="page-title">
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>
    <div class="hairlines" aria-hidden="true"></div>
    <div class="border-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <header class="masthead"><a class="wordmark" href="#" aria-label="dx.world home">dx.world</a></header>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="menu-dialog" aria-expanded="false"><span></span><span></span><span></span></button>
    <h1 class="sr-only" id="page-title">DXWORLD — 2027</h1>

    <div class="artwork" aria-label="The DX emblem, sculpted in chrome and rotating in three dimensions">
      <img class="emblem-fallback" id="emblem-fallback" src="assets/dx-logo.svg" alt="" aria-hidden="true">
      <canvas id="emblem" aria-hidden="true"></canvas>
      <img class="year year-image" src="assets/year-2027.png" alt="2027">
    </div>

    <footer class="corner-controls">
      <button class="outline-button sound-toggle" id="sound-toggle" type="button" aria-label="Enable music" aria-pressed="false">
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span id="sound-label">SOUND: OFF</span>
      </button>
      <button class="outline-button enter-button" id="enter" type="button" aria-haspopup="dialog"><span>ENTER DX</span><svg viewBox="0 0 24 12" aria-hidden="true"><path d="M1 6H22M17 1 22 6 17 11"/></svg></button>
    </footer>
  </main>

  <dialog id="enter-dialog" class="enter-dialog" aria-labelledby="enter-heading">
    <button class="close-dialog" id="close-dialog" type="button" aria-label="Close">×</button>
    <span class="dialog-kicker">DXWORLD / 2027</span>
    <h2 id="enter-heading">First<br>transmission.</h2>
    <p>Sound. Vision. No limits.</p>
    <p class="dialog-note">A new world is taking shape.</p>
    <button class="outline-button dialog-sound" id="dialog-sound" type="button">TURN IT UP <span aria-hidden="true">→</span></button>
  </dialog>
  <dialog id="menu-dialog" class="menu-dialog" aria-labelledby="menu-heading">
    <button class="close-dialog" id="menu-close" type="button" aria-label="Close menu">×</button>
    <span class="dialog-kicker">DXWORLD / 2027</span>
    <h2 id="menu-heading">DXWORLD</h2>
    <nav aria-label="Main navigation">
      <button id="menu-home" type="button"><span>01</span>HOME</button>
      <button id="menu-enter" type="button"><span>02</span>ENTER DX</button>
      <button id="menu-sound" type="button"><span>03</span><span id="menu-sound-label">SOUND: OFF</span></button>
    </nav>
    <p class="menu-foot">SOUND. VISION. NO LIMITS.</p>
  </dialog>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <script src="app.js?v=dx-11"></script>
  <script src="assets/logo-shape.js?v=dx-11"></script>
  <script src="emblem.js?v=dx-11"></script>
</body>
</html>
